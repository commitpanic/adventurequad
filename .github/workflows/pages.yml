# Publikacja strony na GitHub Pages (bez plików roboczych: *.md, dane/, .claude/)
#
# Ustawienia repo: Settings → Pages → Source: „GitHub Actions”

name: Strona

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Przygotuj pliki strony (bez materiałów roboczych)
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github' --exclude '_site' \
            --exclude '.claude' --exclude 'dane' --exclude '*.md'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
